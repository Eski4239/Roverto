# Thresholds — docs/03_DASHBOARD_SPEC.md §2 "Thresholds" table.
# Populated fully in Phase 3/5 (docs/06); placeholder for now.

[link]
default_port = "COM5"
baud = 921600
reconnect_retry_s = 1.0

[logging]
log_dir = "logs"

[camera]
camera_url = "http://192.168.4.1"

[motors]
pwm_max = 120

# Phase 6 — joystick/keyboard drive input (docs/02 §6.12, docs/04 §1b).
[control]
deadband_pct = 8
centre_band = 300          # raw ADC units either side of 2048 counted as "centred"
joystick_timeout_ms = 200
fault_jump_pct = 50
fault_repeat_count = 3
invert_l = false
invert_r = false
speed_limit_default = 1.0

[thresholds.vbat_v]
green_above = 11.1
red_below = 10.5

[thresholds.roll_pitch_deg]
green_below = 20
red_above = 30

[thresholds.rssi_dbm]
green_above = -67
red_below = -80

[thresholds.sonar_dist_cm]
green_above = 50
red_below = 20

[thresholds.last_cmd_age_ms]
green_below = 200
red_above = 500

# No [thresholds.chip_temp_c]: D-011 says chip_temp_c is informational
# only (unreliable on classic ESP32s) and must never be alarmed/colored --
# sysstatswidget.js deliberately never calls thresholdClassFor for it.
# An orphaned entry here was a landmine for future generic threshold code
# that iterates this table (F8).

# Agreed on the top bar (03b layout review, 2026-10-21).
[thresholds.loss_pct]
green_below = 2
red_above = 10

# docs/04_FUTURE_HARDWARE.md §F: below 80 Hz loop rate is a problem.
[thresholds.loop_hz]
green_above = 90
red_below = 80
