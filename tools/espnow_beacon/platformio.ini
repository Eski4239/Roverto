; espnow_beacon -- TEMPORARY test sketch for ESP32 #1, used to exercise ground_bridge
; before rover_main (R3) exists. See README.md. Do not leave this on real hardware.
;
;   python tools/espnow_beacon/gen_golden_arrays.py   (regenerate golden_payloads.h first)
;   cd tools/espnow_beacon
;   pio run -t upload --upload-port COM4
;   pio device monitor -b 115200 -p COM4

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = -I ../../firmware/common -I include
