; mac_reader — prints the WiFi STA MAC of any ESP32 board (the MAC ESP-NOW uses).
; Also validates the pioarduino toolchain (D-001, step R0 in docs/PROGRESS_ROVER_MAIN.md).
;
;   pio run -d tools/mac_reader -t upload --upload-port COM11
;   pio device monitor -b 115200 -p COM11
;
; Pass the port on the command line (it differs per laptop / OS), don't hard-code it here.

[env:esp32]
; pioarduino 55.03.312 = arduino-esp32 3.3.12 (D-001: same pinned release in rover_main and ground_bridge)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
