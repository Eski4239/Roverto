; rover_main — firmware of ESP32 #1 on the rover. docs/01 §5.1, docs/02, docs/04 §1.
; Board: ESP32 DevKit V1. CP210x/CH340 USB driver required on the host (docs/05).
;
;   pio run -d firmware/rover_main -t upload --upload-port COM11
;   pio device monitor -b 115200 -p COM11
;
; Run from PowerShell / the PlatformIO terminal, not Git Bash: the Espressif toolchain installer
; rejects MSYS/MinGW shells. Copy include/secrets.example.h to include/secrets.h before building.

[env:esp32]
; pioarduino 55.03.312 = arduino-esp32 3.3.12 / ESP-IDF 5.5 (D-001: same pinned release as ground_bridge)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; show what you type in the monitor (console commands: status, dump_golden, hw)
monitor_echo = yes
monitor_eol = LF
build_flags = -I ../common
; warnings on for our own code only (libraries are not ours to fix)
build_src_flags = -Wall -Wextra
lib_deps =
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit BMP280 Library@^2.6.8
