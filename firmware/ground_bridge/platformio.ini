; ground_bridge — bridges ESP-NOW (rover) <-> USB serial (laptop). docs/01 §2/§5.2, docs/02 §4.
; Board: ESP32 #2, laptop end of the link. CP210x/CH340 USB driver required on the host (docs/05).
;
;   cd firmware/ground_bridge
;   pio run -t upload --upload-port COM3
;   pio device monitor -b 921600 -p COM3
;
; Run from PowerShell, not Git Bash: the Espressif toolchain installer rejects MSYS/MinGW paths.
; Copy include/secrets.example.h to include/secrets.h (gitignored) before building.

[env:esp32]
; pioarduino 55.03.312 = arduino-esp32 3.3.12 (D-001: same pinned release as rover_main / mac_reader)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 921600
build_flags = -I ../common
lib_deps = bakercp/PacketSerial@^1.4.0
